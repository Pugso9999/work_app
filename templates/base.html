<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>WorkLogPro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      overflow-x: hidden;
    }
    #sidebar {
      min-width: 220px;
      max-width: 220px;
      min-height: 100vh;
      background-color: #061463; /* Bootstrap primary */
      color: white;
    }
    #sidebar a {
      color: white;
      text-decoration: none;
    }
    #sidebar .nav-link.active {
      background-color: #0b5ed7;
    }
    #content {
      width: calc(100% - 220px);
      margin-left: 220px;
      padding: 20px;
    }
  </style>
</head>

<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <nav id="sidebar" class="d-flex flex-column p-3">
      <a href="/" class="d-flex align-items-center mb-3 text-white text-decoration-none">
        <i class="bi bi-clipboard-data me-2"></i>
        <span class="fs-5 fw-bold">WorkLogPro</span>
      </a>
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item">
          <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint=='index' %}active{% endif %}">
            🏠 Dashboard
          </a>
        </li>
        <li>
          <a href="{{ url_for('add') }}" class="nav-link {% if request.endpoint=='add' %}active{% endif %}">
            ➕ เพิ่มงานใหม่
          </a>
        </li>
        <li>
          <a href="{{ url_for('inventory') }}" class="nav-link {% if request.endpoint=='inventory' %}active{% endif %}">
            <i class="bi bi-box-seam"></i> บันทึกอุปกรณ์
          </a>
        </li>
        <li>
          <a href="{{ url_for('daily_check') }}" class="nav-link {% if request.endpoint=='daily_check' %}active{% endif %}">
            ✅ บันทึกประจำวัน
          </a>
        </li>
        <li>
          <a href="{{ url_for('daily_check_history') }}" class="nav-link {% if request.endpoint=='daily_check_history' %}active{% endif %}">
            📊 ประวัติการบันทึกประจำวัน 
          </a>
        </li>
        <li>
          <a href="{{ url_for('switches') }}" class="nav-link {% if request.endpoint=='switches' %}active{% endif %}">
            <i class="bi bi-hdd-network"></i> Switches
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('solutions_categories') }}">
        <i class="bi bi-journal-text"></i> Knowledge 
          </a>
        </li>

      </ul>
    </nav>
    
    <!-- Main content -->
    <div id="content">
      {% block content %}{% endblock %}
    </div>
  </div>

  <!-- Bootstrap + Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- ✅ SweetAlert2 Popup สำหรับ flash message -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <script>
        document.addEventListener("DOMContentLoaded", function() {
          {% for category, message in messages %}
            Swal.fire({
              icon: "{{ 'success' if category == 'success' else 'info' }}",
              title: "{{ message }}",
              timer: 2000,
              showConfirmButton: false
            });
          {% endfor %}
        });
      </script>
    {% endif %}
  {% endwith %}

</body>
</html>
