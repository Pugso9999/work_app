{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    
    <div class="d-flex justify-content-between align-items-center">
        <h3 class="text-primary">
            <i class="bi bi-list-task"></i> วิธีแก้ปัญหา - {{ category.name }}
        </h3>

        <a href="{{ url_for('add_solution', category_id=category.id) }}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> เพิ่มรายการ
        </a>
    </div>

    <div class="card shadow-sm mt-3">
        <div class="card-body">
            <table class="table table-bordered table-hover">
                <thead class="table-primary">
                    <tr>
                        <th>#</th>
                        <th>หัวข้อ</th>
                        <th>รายละเอียด</th>
                        <th>ตัวเลือก</th>
                    </tr>
                </thead>
                <tbody>
                    {% for s in solutions %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ s.title }}</td>
                        <td>{{ s.detail }}</td>
                        <td>
                            <form method="POST" action="{{ url_for('delete_solution', id=s.id) }}" onsubmit="return confirm('ลบรายการนี้?');">
                                <button class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                    {% if solutions|length == 0 %}
                    <tr>
                        <td colspan="4" class="text-center text-muted">ยังไม่มีข้อมูล</td>
                    </tr>
                    {% endif %}
                </tbody>
            </table>
        </div>
    </div>

</div>
{% endblock %}
