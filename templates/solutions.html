{% extends "base.html" %}
{% block content %}

<style>
    .kb-title {
        background: linear-gradient(45deg, #7b3cff, #c700ff);
        -webkit-background-clip: text;
        color: transparent;
        font-weight: bold;
    }
</style>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center">
        <h2 class="kb-title"><i class="bi bi-lightbulb"></i> {{ category.name }}</h2>

        <a href="{{ url_for('add_solution', category_id=category.id) }}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> เพิ่มวิธีแก้
        </a>
    </div>

    <input type="text" class="form-control mt-4" id="searchBox" placeholder="ค้นหาปัญหา / คำสำคัญ...">

    <div class="accordion mt-4" id="solutionsAccordion">

        {% for s in solutions %}
        <div class="accordion-item solution-item">
            <h2 class="accordion-header" id="heading{{ s.id }}">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapse{{ s.id }}">
                    <i class="bi bi-wrench-adjustable me-2"></i> {{ s.title }}
                </button>
            </h2>

            <div id="collapse{{ s.id }}" class="accordion-collapse collapse">
                <div class="accordion-body">
                    <p>{{ s.detail }}</p>

                    <form method="POST" action="{{ url_for('delete_solution', id=s.id) }}"
                          onsubmit="return confirm('ต้องการลบข้อมูลนี้หรือไม่?');">
                        <button class="btn btn-sm btn-danger">
                            <i class="bi bi-trash"></i> ลบ
                        </button>
                    </form>
                </div>
            </div>
        </div>
        {% endfor %}

        {% if solutions|length == 0 %}
        <p class="text-center text-muted mt-4">ยังไม่มีข้อมูลในหมวดนี้</p>
        {% endif %}
    </div>
</div>

<script>
document.getElementById("searchBox").addEventListener("keyup", function () {
    let keyword = this.value.toLowerCase();

    document.querySelectorAll(".solution-item").forEach(item => {
        item.style.display = item.innerText.toLowerCase().includes(keyword) ? "" : "none";
    });
});
</script>

{% endblock %}
