{% extends "base.html" %}
{% block content %}

<style>
    .kb-gradient-title {
        background: linear-gradient(45deg, #6a5af9, #9c27b0);
        -webkit-background-clip: text;
        color: transparent;
        font-weight: 700;
    }
    .kb-card {
        cursor: pointer;
        border-radius: 12px;
        transition: .25s;
        border: none;
    }
    .kb-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }
    .badge-count {
        background-color: #6a5af9;
        color: white;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12px;
    }
</style>
<!-- เพิ่ม -->
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="kb-gradient-title"><i class="bi bi-journal-bookmark-fill"></i> คลังความรู้ (Knowledge Base)</h2>

        <a href="{{ url_for('add_category') }}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> เพิ่มหมวดหมู่
        </a>
    </div>

    <div class="col-md-4 mb-3">
    <div class="card kb-card shadow-sm position-relative">

        <!-- ปุ่มลบ -->
        <form method="POST" 
              action="{{ url_for('delete_category', id=cat.id) }}" 
              style="position:absolute; top:10px; right:10px; z-index:10;" 
              onsubmit="return confirm('ต้องการลบหมวดหมู่นี้พร้อมวิธีแก้ทั้งหมดหรือไม่?');">
            <button class="btn btn-sm btn-danger">
                <i class="bi bi-trash"></i>
            </button>
        </form>

        <!-- คลิกไปดู Solutions -->
        <div class="card-body" onclick="window.location='{{ url_for('solutions', category_id=cat.id) }}'">
            <h5 class="fw-bold"><i class="bi bi-folder"></i> {{ cat.name }}</h5>

            <p class="text-muted small mb-2">
                จำนวนปัญหา <span class="badge-count">{{ cat.problem_count }}</span>
            </p>

            <p class="text-primary small mb-0"><i class="bi bi-eye"></i> คลิกเพื่อดูปัญหา</p>
        </div>
    </div>
</div>

        </div>
        {% endfor %}

        {% if categories|length == 0 %}
        <p class="text-center text-muted mt-4">ยังไม่มีหมวดหมู่</p>
        {% endif %}
    </div>

</div>

{% endblock %}
