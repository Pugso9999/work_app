{% extends "base.html" %}
{% block content %}

<style>
    .kb-header {
        background: linear-gradient(45deg, #6a5af9, #9c27b0);
        color: white;
    }
</style>

<div class="container mt-4">
  <h4>เพิ่มวิธีแก้</h4>
  <form method="POST" action="{{ url_for('add_solutions', category_id=category_id) }}">
    <div class="mb-3">
      <label class="form-label">หัวข้อ</label>
      <input name="title" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">รายละเอียด</label>
      <textarea name="detail" class="form-control" rows="6"></textarea>
    </div>
    <div class="d-flex justify-content-end">
      <a href="{{ url_for('solutions', category_id=category_id) }}" class="btn btn-outline-secondary me-2">ยกเลิก</a>
      <button class="btn btn-primary">บันทึก</button>
    </div>
  </form>
</div>

{% endblock %}
